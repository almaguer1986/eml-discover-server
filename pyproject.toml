[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-discover-server"
version = "0.3.1"
description = "FastAPI service wrapping eml_discover.identify, eml_cost.analyze, and eml_witness.universality_witness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PROPRIETARY-PRE-RELEASE" }
authors = [
    { name = "Monogate Research" },
]
keywords = [
    "symbolic-computation",
    "formula-recognition",
    "rest-api",
    "fastapi",
    "sympy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "sympy>=1.12",
    "eml-cost>=0.2.0",
    "eml-discover>=0.2.0",
    "eml-witness>=0.1.0",
]

[project.optional-dependencies]
serve = [
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "mypy>=1.5",
    "ruff>=0.1",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
eml-discover-server = "eml_discover_server.__main__:main"

[project.urls]
Homepage = "https://monogate.org"
Repository = "https://github.com/almaguer1986/eml-discover-server"
Issues = "https://github.com/almaguer1986/eml-discover-server/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eml_discover_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
